<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concepteur de questionnaires</title><link rel="stylesheet" href="../shared/common.css"><link rel="stylesheet" href="./styles.css">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script></head><body><main id="designer">
<header class="topbar"><div><h1>Concepteur</h1><p>Construction du questionnaire</p></div><div class="selectors">
<label>Questionnaire <select id="questionnaire-select"></select></label><label>Version <select id="version-select"></select></label></div></header>
<div id="status"></div><section class="workspace"><aside class="panel"><div class="panel-title">Structure</div>
<div class="addbar"><button id="add-page">+ Page</button><button id="add-section">+ Section</button><button id="add-question">+ Question</button></div><div id="tree"></div></aside>
<section class="panel"><div class="panel-title">Construction</div><div id="canvas" class="empty-state">Sélectionnez un élément.</div></section>
<aside class="panel properties-panel"><div class="panel-title">Propriétés</div><div id="properties" class="empty-state">Aucun élément sélectionné.</div></aside>
</section></main><script type="module" src="./app.js"></script></body></html>
