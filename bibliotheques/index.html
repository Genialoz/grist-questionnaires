<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bibliothèques</title><link rel="stylesheet" href="../shared/common.css"><link rel="stylesheet" href="../shared/module-nav.css"><link rel="stylesheet" href="./styles.css"><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><script defer src="../shared/module-nav.js"></script></head><body><main class="lib-app"><header><div><h1>Bibliothèques</h1><p>Centralisez les modèles de questionnaires et consultez les regroupements réutilisables.</p></div><button id="refresh">Actualiser</button></header><div id="status"></div><nav class="tabs"><button data-tab="questionnaires" class="active">Questionnaires</button><button data-tab="groupings">Regroupements</button></nav><section id="content"></section></main><dialog id="grouping-dialog" class="lib-dialog"><form id="grouping-form"><div class="dialog-head"><div><h2 id="grouping-dialog-title">Nouveau regroupement</h2><p>Créez un regroupement réutilisable, indépendant des Dashboards.</p></div><button type="button" id="close-grouping">×</button></div><input type="hidden" name="id"><input type="hidden" name="origin"><label>Nom<input name="name" required></label><label>Source<input name="source" placeholder="Ex. structure_effective ou code de question"></label><label>Description<textarea name="description"></textarea></label><div class="groups-title"><strong>Groupes</strong><button type="button" id="add-group-row">+ Ajouter un groupe</button></div><div id="group-editor"></div><div class="dialog-actions"><button type="button" id="cancel-grouping">Annuler</button><button type="submit" class="primary">Enregistrer</button></div></form></dialog><script type="module" src="./app.js"></script></body></html>
